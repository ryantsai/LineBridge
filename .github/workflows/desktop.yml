name: Build LineBridge desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native installers to build and verify
        type: choice
        default: all
        options: [all, windows, macos]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'macos' && '[{"name":"macOS Apple Silicon DMG","runner":"macos-15","artifact":"macos-arm64","build":"build:macos"},{"name":"macOS Intel DMG","runner":"macos-15-intel","artifact":"macos-x64","build":"build:macos"}]' || inputs.platform == 'windows' && '[{"name":"Windows x64 NSIS","runner":"windows-2025","artifact":"windows-x64","build":"build:windows"}]' || '[{"name":"Windows x64 NSIS","runner":"windows-2025","artifact":"windows-x64","build":"build:windows"},{"name":"macOS Apple Silicon DMG","runner":"macos-15","artifact":"macos-arm64","build":"build:macos"},{"name":"macOS Intel DMG","runner":"macos-15-intel","artifact":"macos-x64","build":"build:macos"}]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-go@v7.0.0
        if: runner.os == 'macOS'
        with:
          go-version: 1.27.1
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Bundle shared service and verified native runtimes
        run: |
          node scripts/build-desktop-service.mjs
          node scripts/prepare-runtime.mjs
      - name: Check Rust shell
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native installer and checksum
        run: npm run ${{ matrix.build }}
      - name: Verify Windows native service lifetime
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Verify Mac signatures, native helpers and service lifetime
        if: runner.os == 'macOS'
        run: npm run verify:macos
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: LineBridge-${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
