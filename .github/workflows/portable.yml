name: Build LineBridge portable CLI bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Portable ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, runner: windows-2025}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x64, runner: macos-15-intel}
          - {target: linux-x64, runner: ubuntu-24.04}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package:portable
      - name: Test extracted bundle without Node or npm on PATH
        run: npm run test:portable
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: LineBridge-portable-${{ matrix.target }}
          path: release/portable/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  # Public repositories can use the standard native ARM runner. Private repos
  # can opt in with the label of an available native ARM64 Linux runner.
  linux-arm64:
    if: github.event.repository.private == false || vars.LINEBRIDGE_LINUX_ARM64_RUNNER != ''
    runs-on: ${{ vars.LINEBRIDGE_LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package:portable
      - name: Test extracted bundle without Node or npm on PATH
        run: npm run test:portable
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: LineBridge-portable-linux-arm64
          path: release/portable/linux-arm64/
          if-no-files-found: error
          retention-days: 14
