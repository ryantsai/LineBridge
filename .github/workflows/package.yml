name: Verify and package LineBridge npm

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:smoke
      - name: Native synthetic Windows/macOS client credential storage
        run: npm run test:credentials:native
      - run: npm run package
      - run: npm run test:package-cli
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: LineBridge-npm-${{ matrix.os }}-node${{ matrix.node }}
          path: release/npm/
          if-no-files-found: error
          retention-days: 14
